<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Contact Us</h1>

    <form id="contact-form" novalidate action="https://formspree.io/f/xbglkrla" method="POST">

      <div class="group">
        <div class="field">
          <label for="name">Full name <span aria-hidden="true">*</span></label>
          <input type="text" id="name" name="name" placeholder="Enter your name"
                 autocomplete="name" required>
        </div>
        <p class="error" id="name-error" role="alert"></p>
      </div>

      <div class="row">
        <div class="group">
          <div class="field">
            <label for="email">Email <span aria-hidden="true">*</span></label>
            <input type="email" id="email" name="email" placeholder="Enter your email"
                   autocomplete="email" required>
          </div>
          <p class="error" id="email-error" role="alert"></p>
        </div>

        <div class="group">
          <div class="field">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number"
                   autocomplete="tel">
          </div>
          <p class="error" id="phone-error" role="alert"></p>
        </div>
      </div>

      <div class="group">
        <div class="field select-field">
          <label for="service">Needed services <span aria-hidden="true">*</span></label>
          <select id="service" name="service" required>
            <option value="" selected>Please choose</option>
            <option value="web-design">Web design</option>
            <option value="web-development">Web development</option>
            <option value="branding">Branding</option>
            <option value="seo">SEO</option>
            <option value="other">Other</option>
          </select>
          <svg class="chevrons" width="10" height="16" viewBox="0 0 10 16" fill="none"
               stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
               stroke-linejoin="round" aria-hidden="true">
            <path d="M1.5 6 5 2.5 8.5 6"/>
            <path d="M1.5 10 5 13.5 8.5 10"/>
          </svg>
        </div>
        <p class="error" id="service-error" role="alert"></p>
      </div>

      <div class="group">
        <div class="field message-field">
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="Your message here..."></textarea>
        </div>
      </div>

      <p class="status" id="form-status" role="status" aria-live="polite"></p>

      <button type="submit" class="submit" id="submit-btn">
        <span class="submit-label">Submit</span>
        <svg width="18" height="12" viewBox="0 0 18 12" fill="none" stroke="currentColor"
             stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M1 6h15M11.5 1.5 16 6l-4.5 4.5"/>
        </svg>
      </button>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
